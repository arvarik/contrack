<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint into the display cutout area; the
      mobile tab bar pads itself with env(safe-area-inset-bottom) so it still
      clears the iOS home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Contrack — A self-hosted People CRM for managing your personal and professional network. Keyboard-first, privacy-focused."
    />
    <!--
      One per palette. The browser picks the matching one, so the phone's
      status bar and the desktop title bar follow the page rather than sitting
      in a colour the app stopped using several versions ago.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8f6f2"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1315"
    />

    <!--
      Paints the chosen theme before the first frame. A file rather than an
      inline script because the production CSP is `script-src 'self'`, and one
      flash of the wrong palette is not worth loosening it. See
      public/theme-boot.js.
    -->
    <script src="/theme-boot.js"></script>

    <!--
      Preload the two Latin faces. They are self-hosted (see src/fonts.css) and
      always needed, but the browser only discovers them after it has parsed
      the CSS — which is a whole round trip late. `crossorigin` is required
      even same-origin, because font fetches are CORS-mode and a preload
      without it is a second, unused fetch.

      Only the `latin` subsets are preloaded; every other subset stays lazy
      behind its unicode-range, which is the point of shipping them separately.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The brand mark: the corvid on the gradient tile. Every icon is generated
      from src/assets/corvidPaths.ts by `npm run brand:icons`, so do not edit
      the files in public/ by hand. See docs/brand/README.md.

      One picture per size, not one SVG for every size. Each favicon is drawn
      for its pixels: 16 is the tab at 1x, 32 the tab at 2x, 48 the tab at 3x
      and search results. The browser takes the one that fits the screen. An
      SVG favicon would win over all three and scale one weight to every size,
      which is what made the tab's bird hard to read. The .ico holds the same
      three frames for everything that asks for /favicon.ico.

      Browsers pin a favicon hard; the `?v=` query makes them fetch these.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png?v=corvid-2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=corvid-2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48.png?v=corvid-2"
    />
    <link rel="icon" href="/favicon.ico?v=corvid-2" sizes="16x16 32x32 48x48" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=corvid-2"
    />
    <link rel="manifest" href="/site.webmanifest?v=corvid-2" />

    <!--
      Link previews. The image is the app icon, the name and the first line of
      the description above, rendered by the same script in the app's own
      faces. A relative path is the most a self-hosted app can promise: its
      origin is whatever the instance is served from.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contrack" />
    <meta
      property="og:description"
      content="A self-hosted People CRM for managing your personal and professional network."
    />
    <meta property="og:image" content="/og-image.png?v=corvid-2" />
    <meta
      property="og:image:alt"
      content="The Contrack app icon, a corvid in a C, beside the name and the line: A self-hosted People CRM for managing your personal and professional network."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Base title only. Every route sets its own via usePageTitle(), which
      renders "Contrack - <Page>"; this is what shows before React mounts.
    -->
    <title>Contrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
