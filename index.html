<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover paints into the cutout area. The tab bar and the shell
      pad themselves with the safe-area insets.
      interactive-widget=resizes-content makes Android shrink the page for the
      keyboard. iOS ignores it, and useSoftKeyboard covers iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Contrack — A self-hosted People CRM for managing your personal and professional network. Keyboard-first, privacy-focused."
    />
    <!--
      One per palette, so the phone's status bar and the desktop title bar
      follow the page.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8f6f2"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1315"
    />

    <!--
      Paints the chosen theme before the first frame. A file, not an inline
      script, because the production CSP is `script-src 'self'`.
    -->
    <script src="/theme-boot.js"></script>

    <!--
      Preloads the two Latin faces (src/fonts.css), which the browser finds
      only after it parses the CSS. `crossorigin` is required even on the same
      origin: font fetches are CORS-mode, and without it the preload is wasted.
      Other subsets stay lazy behind their unicode-range.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The brand mark. `npm run brand:icons` generates every icon from
      src/assets/corvidPaths.ts, so do not edit them in public/ by hand.

      One picture per size, each drawn for its pixels (16, 32 and 48). No SVG
      favicon: it would win over all three and scale one weight to every size.
      The .ico holds the same three frames. The `?v=` query defeats the
      browser's favicon cache.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png?v=corvid-2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=corvid-2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48.png?v=corvid-2"
    />
    <link rel="icon" href="/favicon.ico?v=corvid-2" sizes="16x16 32x32 48x48" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=corvid-2"
    />
    <link rel="manifest" href="/site.webmanifest?v=corvid-2" />

    <!--
      Link previews. The path is relative: a self-hosted app cannot know its
      origin.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contrack" />
    <meta
      property="og:description"
      content="A self-hosted People CRM for managing your personal and professional network."
    />
    <meta property="og:image" content="/og-image.png?v=corvid-2" />
    <meta
      property="og:image:alt"
      content="The Contrack app icon, a corvid in a C, beside the name and the line: A self-hosted People CRM for managing your personal and professional network."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Shown before React mounts. Each route sets its own (usePageTitle). -->
    <title>Contrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
