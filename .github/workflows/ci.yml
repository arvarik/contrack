name: CI

on:
  push:
    branches: ["main", "v2.0"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "v2.0", "arvind/harden-*"]
  # Manual re-run, and an escape hatch when GitHub's hosted pool is congested
  # or degraded — pick the hppc self-hosted runner instead of waiting in queue.
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run tests"
        type: choice
        default: "ubuntu-latest"
        options:
          - "ubuntu-latest"
          - "hppc"

concurrency:
  # A newer push supersedes an in-flight run for the same ref. Tags and main
  # are never cancelled — those produce published artifacts.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The one network call in `npm ci` that leaves the npm registry.
#
# `onnxruntime-node` ships the CPU runtime inside the package for every
# platform, and its install metadata asks for a download on exactly one:
# linux/x64, where it fetches the CUDA execution provider from
# api.nuget.org. Runners are linux/x64, so every run pulled it, and when
# nuget timed out the install failed before a line of this repo compiled
# (run 35685137580: `AggregateError [ETIMEDOUT] connect 150.171.109.74:443`
# in onnxruntime-node's postinstall).
#
# Nothing here wants it. The embedding model runs on the CPU worker and no
# code names an execution provider, so the CUDA binaries were downloaded
# and never loaded. `skip` makes the install script exit before the
# download, which removes the dependency on nuget and about 300 MB of
# transfer from every job.
#
# The scripts that read this are `script/install.js` and
# `script/install-utils.js` in that package, both install-time only, so
# setting it for the whole workflow cannot reach the tests.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# The token every job gets unless the job asks for more. Install scripts from
# npm run in these jobs, so a job that only tests can read the repository and
# nothing else. The image and release jobs below name the scopes they need.
permissions:
  contents: read

jobs:
  build-and-test:
    # Fork pull requests carry untrusted code, so they are pinned to
    # GitHub-hosted runners and can never reach the self-hosted machine.
    runs-on: ${{ github.event.inputs.runner == 'hppc' && fromJSON('["self-hosted","hppc"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .nvmrc is the one pin for CI and for developers' version managers.
      - name: Use the Node.js version in .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm run lint = oxlint, tsc --noEmit (strict) and the tenant lint, one gate
      - name: Lint + Type Check
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Run Tests
        run: npm run test:coverage

      - name: Production Build
        run: npm run build

  # ── Browser journeys ───────────────────────────────────────────────────────
  # What the unit suite cannot see: real focus, real dialogs, real live
  # regions, a real phone viewport. Playwright drives the PRODUCTION build
  # (the same dist/ a release ships, with the CSP on) in headless Chromium,
  # walks the keyboard, dialog, search, phone-form and account journeys, and
  # scans every screen with axe. See docs/accessibility.md.
  #
  # Its own job rather than a step in build-and-test, so a lint failure and a
  # focus regression are reported separately and neither hides the other.
  # Always the hosted runner: Playwright installs Chromium's system libraries
  # with apt, which needs the sudo the self-hosted runner deliberately lacks.
  browser-a11y:
    name: Browser accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Node.js version in .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

      # Chromium is cached by Playwright version, so a cache hit skips the
      # download and only the apt libraries are installed.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run browser journeys
        run: npx playwright test

      # The HTML report carries every axe result, the trace of any retried
      # test and the screenshot of any failure. Uploaded on failure and on
      # success alike, so a green run can still be inspected.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Container image ────────────────────────────────────────────────────────
  # Each architecture builds on a runner of that architecture. Emulating arm64
  # through QEMU works but compiles this project's native modules
  # (better-sqlite3, onnxruntime) under emulation, which is dramatically
  # slower. Public repos get free arm64 runners, so neither arch is emulated.
  #
  # Each job pushes an untagged manifest by digest; `merge` then assembles the
  # digests into one multi-arch tag. This is the pattern docker/build-push-action
  # documents for splitting a build across runners.
  build-image:
    needs: [build-and-test, browser-a11y]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Cache is scoped per platform so the two jobs don't evict each other.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # An SBOM, the list of every package in the image, rides with each
          # platform's manifest as an attestation. `docker buildx imagetools
          # inspect <tag> --format '{{ json .SBOM }}'` prints it.
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token and attestations sign the provenance record below. The signing
    # certificate comes from Sigstore, through the workflow's OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Word splitting is intentional: each substitution expands to a list
          # of separate arguments (-t tag -t tag, then one ref per digest).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Verify both architectures are present
        run: |
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG"

          # Parse the index with jq rather than grepping the raw JSON. The
          # previous `grep '"architecture":"amd64"'` assumed compact output;
          # current buildx pretty-prints `--raw`, so the pattern never matched
          # and this step failed every run on a perfectly good image.
          #
          # The `os == "linux"` filter matters too: buildx attaches a
          # provenance and SBOM attestation per platform, and those manifests
          # carry `"architecture": "unknown", "os": "unknown"`.
          RAW=$(docker buildx imagetools inspect "$TAG" --raw)
          for arch in amd64 arm64; do
            echo "$RAW" | jq -e --arg a "$arch" \
              'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $a)' \
              > /dev/null \
              || { echo "::error::$TAG is missing linux/$arch"; exit 1; }
            echo "  ✓ linux/$arch"
          done

      # The digest of the multi-arch index, which every tag above points at.
      # The provenance record and the scan below name the image by it, so
      # they describe exactly what was pushed, whatever a tag points at later.
      - name: Read the image digest
        id: index
        run: |
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{ json .Manifest }}' | jq -r .digest)
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::No digest for $TAG"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$TAG is $DIGEST"

      # A signed record of which workflow run, commit and repository built the
      # image, pushed to the registry beside it. Anyone can check it with
      # `gh attestation verify oci://ghcr.io/arvarik/contrack:<tag> --owner
      # arvarik`, as SECURITY.md says. A storage record is for organization
      # artifact pages, which a personal repository does not have.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # ── Image scan ─────────────────────────────────────────────────────────────
  # Grype reads the pushed image and lists the known vulnerabilities that have
  # a fixed version, in the packages of the Debian base and in node_modules.
  # The results go to the Security tab as code scanning alerts. The scan
  # reports and never fails the run: a new CVE in the base image is a reason
  # to rebuild, not a reason to hold back a release that is already pushed.
  #
  # Grype, not Trivy: in March 2026 an attacker force-pushed most tags of
  # aquasecurity/trivy-action to malware that stole CI secrets.
  scan-image:
    needs: merge-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The package can be private, and Grype pulls with Docker's login.
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.merge-image.outputs.digest }}
          fail-build: false
          only-fixed: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-scan

  # Version tags (vX.Y.Z) get a GitHub Release. Created only if one doesn't
  # already exist for the tag — publishing via `gh release create` first (to
  # attach hand-written notes) makes this a no-op rather than a conflict.
  release:
    needs: [build-and-test, browser-a11y]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
