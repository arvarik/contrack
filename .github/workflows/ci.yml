name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  # Manual re-run, and an escape hatch when GitHub's hosted pool is congested
  # or degraded — pick the hppc self-hosted runner instead of waiting in queue.
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run tests"
        type: choice
        default: "ubuntu-latest"
        options:
          - "ubuntu-latest"
          - "hppc"

concurrency:
  # A newer push supersedes an in-flight run for the same ref. Tags and main
  # are never cancelled — those produce published artifacts.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Fork pull requests carry untrusted code, so they are pinned to
    # GitHub-hosted runners and can never reach the self-hosted machine.
    runs-on: ${{ github.event.inputs.runner == 'hppc' && fromJSON('["self-hosted","hppc"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm run lint = eslint . && tsc --noEmit (strict) — one gate for both
      - name: Lint + Type Check
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Run Tests
        run: npm run test:coverage

      - name: Production Build
        run: npm run build

  # ── Container image ────────────────────────────────────────────────────────
  # Each architecture builds on a runner of that architecture. Emulating arm64
  # through QEMU works but compiles this project's native modules
  # (better-sqlite3, onnxruntime) under emulation, which is dramatically
  # slower. Public repos get free arm64 runners, so neither arch is emulated.
  #
  # Each job pushes an untagged manifest by digest; `merge` then assembles the
  # digests into one multi-arch tag. This is the pattern docker/build-push-action
  # documents for splitting a build across runners.
  build-image:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Cache is scoped per platform so the two jobs don't evict each other.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Word splitting is intentional: each substitution expands to a list
          # of separate arguments (-t tag -t tag, then one ref per digest).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Verify both architectures are present
        run: |
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG"

          # Parse the index with jq rather than grepping the raw JSON. The
          # previous `grep '"architecture":"amd64"'` assumed compact output;
          # current buildx pretty-prints `--raw`, so the pattern never matched
          # and this step failed every run on a perfectly good image.
          #
          # The `os == "linux"` filter matters too: buildx attaches a
          # provenance attestation per platform, and those manifests carry
          # `"architecture": "unknown", "os": "unknown"`.
          RAW=$(docker buildx imagetools inspect "$TAG" --raw)
          for arch in amd64 arm64; do
            echo "$RAW" | jq -e --arg a "$arch" \
              'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $a)' \
              > /dev/null \
              || { echo "::error::$TAG is missing linux/$arch"; exit 1; }
            echo "  ✓ linux/$arch"
          done

  # Version tags (vX.Y.Z) get a GitHub Release. Created only if one doesn't
  # already exist for the tag — publishing via `gh release create` first (to
  # attach hand-written notes) makes this a no-op rather than a conflict.
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
