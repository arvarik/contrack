# OpenSSF Scorecard checks the repository against supply-chain practices:
# pinned actions, token permissions, branch rules, a security policy, code
# review, dependency updates and more. The results go to the Security tab and
# to scorecard.dev, which serves the README badge.
#
# Scorecard reads the default branch only, so this file takes effect when it
# reaches `main`. To publish, the workflow must keep Scorecard's rules: read-only
# permissions at the top, no top-level `env` or `defaults`, and only the
# actions below.
name: Scorecard

on:
  push:
    branches: ["main"]
  # A change to a branch rule changes the score.
  branch_protection_rule:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to scorecard.dev, signed through the OIDC token.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
